<!DOCTYPE html>
<html>
<head>
    <title>Blog Home</title>
</head>
<body>
    <h1>My Blog</h1>

    {% for post in posts %}
        <h2><a href="{% url 'post_detail' post.slug %}">{{ post.title }}</a></h2>
        <p>Published on {{ post.created_at }}</p>
        <hr>
    {% endfor %}
</body>
</html>
